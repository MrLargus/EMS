<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>|EMS| Портал стажировки и собеседований</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/certificate.css">
</head>

<body>

  <header class="ems-header">
    <div class="ems-header-inner">
      <img src="assets/logo-star.svg" alt="EMS" class="ems-logo">
      <div class="ems-header-text">
        <span class="ems-title">Emergency Medical Service</span>
        <span class="ems-subtitle">Отдел кадров и стажировки</span>
      </div>
    </div>
  </header>

  <main class="ems-content">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="startScreen">
      <h1>Портал EMS</h1>
      <div class="subtitle">Выберите необходимый раздел</div>

      <!-- Контейнер для приколов -->
      <div id="jokeOverlay" style="position: relative; display: none;"></div>

      <div class="curator-input-group" id="curatorGroup">
        <label for="globalCuratorInput">👤 Ваш Discord-логин (Куратор)</label>
        <input type="text" id="globalCuratorInput" placeholder="Например: name#1234 или @name" autocomplete="off">
      </div>

      <div class="menu-grid">
        <button class="menu-btn special" onclick="tryOpenInterviewTest()">
          <span class="btn-title">Тест для кандидатов</span>
          <span class="btn-subtitle">Вопросы для собеседований</span>
        </button>
        <button class="menu-btn" onclick="tryOpenChecklist()">
          <span class="btn-title">Чек-лист стажировки</span>
          <span class="btn-subtitle">Лекции для интернов</span>
        </button>
      </div>
    </div>

        <!-- ЧЕК-ЛИСТ СТАЖИРОВКИ -->
    <div id="checklistWrapper" style="display: none;">
      <button class="back-btn" onclick="goToMenu()">← Вернуться в главное меню</button>
      <h1>Чек-лист стажировки интерна</h1>
      <div class="subtitle">Отметьте выполненные пункты</div>

      <!-- Блок добавления стажёров -->
      <div class="trainee-manager">
        <div id="traineeInputsContainer"></div>
        <button type="button" id="addTraineeBtn" class="gen-btn" onclick="addTraineeInput()" style="margin-top: 10px;">
          ➕ Добавить стажёра
        </button>
      </div>

      <form id="checklistForm"></form>

      <div class="form-actions">
        <button onclick="startExam()">📝 Провести экзамен</button>
        <button class="secondary" onclick="resetChecklist()">Очистить форму</button>
      </div>

      <div id="checklistResult"></div>

      <!-- Блок экзамена (появляется после нажатия "Провести экзамен") -->
      <div id="examBlock" style="display: none; margin-top: 30px;">
        <h2 style="color: #1a3a6c; text-align: center;">Экзамен по чек-листу</h2>
        <div id="examQuestionsContainer"></div>
        <div class="form-actions" style="margin-top: 20px;">
          <button onclick="checkExam()">Завершить экзамен</button>
        </div>
        <div id="examResult"></div>
      </div>

      <!-- Финальный блок аудита (появляется после завершения экзамена) -->
      <div id="finalAuditBlock" style="display: none; margin-top: 30px;"></div>
    </div>

    <!-- ТЕСТ ДЛЯ КАНДИДАТОВ -->
    <div id="interviewWrapper" style="display: none;">
      <button class="back-btn" onclick="goToMenu()">← Вернуться в главное меню</button>
      <h1>Собеседование</h1>
      <div class="subtitle">Отметьте выполненные пункты и ответьте на вопросы</div>

      <form id="interviewQuiz"></form>

      <div class="form-actions">
        <button onclick="checkInterview()">Завершить собеседование</button>
        <button class="secondary" onclick="resetInterview()">Очистить форму</button>
      </div>

      <div id="interviewResult"></div>
      <!-- Блок кадрового аудита -->
      <div id="auditBlock" style="display: none; margin-top: 20px;"></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/main.js"></script>

  <script data-goatcounter="https://mrlargus.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
